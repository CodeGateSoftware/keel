[project]
name = "keel"
version = "0.1.0"
description = "Offline-first, broker-agnostic, rule-based spot-trading agent (halal policy by default)"
readme = "README.md"
authors = [
    { name = "CodeGate Software" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "coinbase-advanced-py>=1.8.4",
    "cryptography>=49.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "keel-core",
]

[project.scripts]
keel = "keel.cli:cli"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
keel-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP042: the design spec pins `class X(str, Enum)` explicitly (not `StrEnum`) for these types.
ignore = ["UP042"]
