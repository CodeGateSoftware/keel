[project]
name = "halal-cb"
version = "0.1.0"
description = "Offline-first halal Coinbase auto-trading agent"
readme = "README.md"
authors = [
    { name = "Elmehdi Aitbrahim", email = "eaitbrahim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coinbase-advanced-py>=1.8.4",
    "cryptography>=49.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP042: the design spec pins `class X(str, Enum)` explicitly (not `StrEnum`) for these types.
ignore = ["UP042"]
