<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keel</title>
<!--
  keel's client shell (#536). The first JavaScript this project ships.

  ── WHERE THIS IS SERVED FROM ───────────────────────────────────────────────────────────────
  `/`, since #540. The seven server-rendered pages that owned the root paths are deleted, and
  `keel/web/render.py` with them: the server's whole job is now static files with correct headers
  plus JSON, and this file is the application rather than a second one parked beside it.

  The move cost one edit per file rather than a hunt, because `tests/web/test_client_assets.py`
  has pinned the three places that spell the prefix -- `staticfiles.STATIC_PREFIX`, the hrefs
  below, and `main.js`'s `BASE` -- since the prefix was introduced at #535.

  ── WHY THE SHELL IS MARKUP AND ONLY THE VIEW IS BUILT BY SCRIPT ────────────────────────────
  The header, the nav, the landmarks and the footer are HTML here rather than nodes `main.js`
  creates. Three reasons, in order of weight:

    1. `<noscript>` below can only say something useful if there is a page for it to say it on.
       A shell built entirely by script degrades to a blank white document.
    2. It is the project's own argument for choosing the web at all (§4 of the spec's
       Philosophy): the structure of the page is readable in view-source without running
       anything.
    3. The nav is a fixed list of eight links. Building a fixed list at runtime buys nothing and
       costs the keyboard path before the module has loaded.

  ── NO INLINE SCRIPT AND NO INLINE STYLE, AND THAT IS ENFORCED ──────────────────────────────
  `keel/web/server.py`'s `_STATIC_CSP` is `default-src 'self'` with NO `'unsafe-inline'`, so an
  inline `<style>` or `<script>` block here would be silently refused by the browser rather than
  caught in review. Everything is a same-origin file. `<base href>` is impossible for the same
  reason -- `base-uri 'none'` -- which is why the hrefs below are absolute rather than relative
  to a declared base.

  ── THE ONE NON-MODULE SCRIPT, AND WHY IT IS WHERE IT IS (#597) ─────────────────────────────
  `/js/theme.js` below is a CLASSIC script, the only one this shell loads. It exists to restore
  the reader's stored light/dark choice on `<html>` BEFORE FIRST PAINT, and a `type="module"`
  script cannot do that job: modules are deferred by definition, so the page would paint in the
  OS theme and then flip after the module loaded -- a flash of the wrong theme on every load
  for every reader who has chosen. The keeltrading.com pattern this copies (its `BaseHead`
  restores `keel-theme` from `localStorage` in an inline head script) needs exactly one script
  and ours must be same-origin rather than inline, which the policy permits and nothing else
  about the shell changes: it is still a file this repository serves, byte for byte as authored.

  It sits AHEAD of the stylesheet on purpose. `data-theme` must be on the root before a single
  rule is applied to a single element, which is also why this is a parser-blocking classic
  script rather than `defer`: the fifteen milliseconds it costs on a loopback socket buy the
  guarantee that no reader ever sees the wrong paper.
-->
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/keel.css">
<!--
  ── THE INSTALL SURFACE (#538), AND THE ONE ATTRIBUTE THAT MAKES IT WORK ────────────────────
  `crossorigin="use-credentials"` is NOT boilerplate and NOT optional here. A `rel="manifest"`
  link is fetched with credentials mode "omit" by default -- no cookies -- and every response
  this server sends is gated on the session cookie (`server._admitted`). Without the attribute
  the manifest fetch is a 403, the browser reports no manifest, and the app is simply not
  installable, with nothing in the page or the console pointing at the cause.

  `theme-color` is the standalone window's title bar; the two `icon` links are for the browser
  tab and for iOS's home screen, which reads `apple-touch-icon` and ignores the manifest's
  `icons` array entirely.
-->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0c5d52">
<link rel="icon" href="/icons/keel.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/keel-192.png">
<script type="module" src="/js/main.js"></script>
</head>
<body>

<a class="skip" href="#view">Skip to content</a>

<header>
  <!--
    THE BRAND BLOCK (#597): the mark and the wordmark, in ONE anchor to `/`.

    ── WHY THE MARK IS INLINE RATHER THAN AN `<img src="/icons/keel.svg">` ─────────────────────
    The favicon must be one fixed file, so it is a fixed raster of the LIGHT theme: a teal
    square, paper strokes. The header sits on both the paper and the slate, and an `<img>` of
    that file would carry light-theme literals onto dark slate -- the square still reads (it is
    the accent teal both ways) but the strokes were chosen against paper. Inlined, the same
    geometry can reference the palette's tokens instead (`--accent` for the square, `--bg` for
    the strokes, in `keel.css`), so the mark is the favicon's shape wearing each theme's own
    colours. `tests/web/test_client_assets.py::test_the_inline_mark_is_the_one_the_icons_carry`
    pins that the GEOMETRY stays the icon's, so this cannot drift into a second drawing.

    ── ONE ANCHOR, NOT TWO ─────────────────────────────────────────────────────────────────────
    The mark and the wordmark are one link to `/` -- the app's home since #540, where
    `main.js::BASE` and this file's nav hrefs agree. A brand where the word is clickable and
    the mark beside it is not is a brand that looks half-finished, and the fix is structural:
    one `<a>` around both halves. `aria-label` says where it goes rather than restating the
    wordmark, so a reader hears "keel home, link"; the svg is `aria-hidden` for the same
    reason. Keyboard focus comes from being an anchor -- the global `:focus-visible` ring in
    `keel.css` is the visible half of that.

    This block is markup, not `main.js` nodes, for the reasons at the top of this file: it is
    readable in view-source, present under `<noscript>`, and focusable before the module loads.
  -->
  <a class="brand" href="/" aria-label="keel home">
    <svg class="mark" viewBox="0 0 1 1" aria-hidden="true">
      <rect width="1" height="1" rx="0.208333"/>
      <g fill="none" stroke-width="0.0708333" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0.5 0.166667 L 0.5 0.583333"/>
        <path d="M 0.5 0.166667 L 0.366667 0.333333"/>
        <path d="M 0.5 0.166667 L 0.633333 0.333333"/>
        <path d="M 0.5 0.583333 L 0.440583 0.586792 L 0.38725 0.597 L 0.33975 0.613667 L 0.297917 0.636458 L 0.261542 0.665125 L 0.230458 0.699333 L 0.204458 0.738833 L 0.183333 0.783333 L 0.816667 0.783333 L 0.795542 0.738833 L 0.769542 0.699333 L 0.738458 0.665125 L 0.702083 0.636458 L 0.66025 0.613667 L 0.61275 0.597 L 0.559417 0.586792 L 0.5 0.583333"/>
      </g>
    </svg>
    <span>keel</span>
  </a>
  <nav aria-label="Views">
    <ul>
      <li><a href="/status">Status</a></li>
      <li><a href="/setup">Setup</a></li>
      <li><a href="/activity">Activity</a></li>
      <li><a href="/orders">Orders</a></li>
      <li><a href="/positions">Positions</a></li>
      <li><a href="/balances">Balances</a></li>
      <li><a href="/insights">Insights</a></li>
      <li><a href="/rules">Rules</a></li>
      <li><a href="/venues">Venues</a></li>
      <li><a href="/gates">Gates</a></li>
      <!--
        THE EIGHTH NAV ENTRY IS A LINK, NOT A VIEW (#539).

        `render.py`'s NAV has eight entries and this client has seven, and the difference is the
        glossary. keel's `docs/` lives at the REPOSITORY root, outside the `keel/` module that
        `uv_build` packages, so no wheel has ever carried it -- every installed deployment
        renders an empty glossary today. That is not fixable with a packaging glob (measured at
        #535: the `artifacts` key is inert on the pinned backend), so the documentation is
        linked rather than shipped.

        The href here is the un-versioned form and `main.js` replaces it with `?v=<build>` as
        soon as `/api/config` answers. It is spelled out in the markup anyway rather than left
        empty, because view-source is one of the reasons this project chose the web (§4), and a
        nav entry whose destination only exists after a script runs is not readable there.
      -->
      <li><a id="docs-link" href="https://keeltrading.com/en/docs/"
             target="_blank" rel="noopener noreferrer">Docs<span aria-hidden="true"> &#8599;</span></a></li>
    </ul>
  </nav>

  <!--
    THE MODE BADGE (#597): which deployment is this browser looking at.

    Read-only, in the strictest sense this app has: it DISPLAYS the served config's
    `auto_trade.mode` and nothing else. Mode is a config-file edit plus a terminal action by
    design (the TTY confirmation gate exists for exactly that), and there is no control here,
    no route behind one, and no capability added -- the value crosses on `/api/config`
    (`payload.config_payload`'s note records the boundary) because that is the one endpoint
    every view reads at boot, which is what makes the badge present everywhere rather than only
    where a status report happens to load.

    Empty in the markup, like `#build` in the footer: `main.js` fills it from the boot config
    read. No `aria-live` and no `role` -- it changes once, at boot, and this page keeps exactly
    one live region (see the note beside `#engine`). Until it fills it is hidden
    (`:empty` in `keel.css`), because an empty pill is a stray mark, and an unreadable config
    should cost the badge rather than guess a mode.
  -->
<span class="right">
    <span id="mode-badge" class="pill mode"></span>
  
    <!--
      THE THEME TOGGLE (#597): two states, and the stylesheet is the state machine.
  
      The css keys dark on BOTH `@media (prefers-color-scheme: dark) :root:not([data-theme=
      "light"])` and `:root[data-theme="dark"]`, so: no stored choice -> the OS preference paints
      the page; a stored choice -> it paints the page on any OS. This button writes that one
      attribute (`main.js` handles the click; `js/theme.js` restores it before first paint) and
      stores the choice under `keel-theme`, the same key keeltrading.com's toggle uses.
  
      BOTH icons ship here and the STYLESHEET decides which one shows -- the same two selectors
      that paint the page decide which icon is visible, so what a reader sees in the circle is
      always the icon of the theme they would switch TO, and it cannot disagree with the painted
      page even in the moment between this markup parsing and `main.js` loading. The icons are
      the site's own sun and moon (`Header.astro`), inline SVG on `currentColor`: no icon font,
      no external asset, and legible on both themes because the ink is the theme's own.
    -->
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-label="Toggle light and dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <line x1="12" y1="2.5" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="21.5"/>
        <line x1="2.5" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="21.5" y2="12"/>
        <line x1="5.3" y1="5.3" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="18.7" y2="18.7"/>
        <line x1="5.3" y1="18.7" x2="7" y2="17"/>
        <line x1="17" y1="7" x2="18.7" y2="5.3"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.2 13.2A8.2 8.2 0 1 1 10.8 3.8a6.5 6.5 0 0 0 9.4 9.4Z"/>
      </svg>
    </button>
  </span>
</header>

<main id="view" tabindex="-1">

  <noscript>
    <div class="card">
      <h1>This page needs JavaScript</h1>
      <p>
        keel's client is plain ES modules with no bundler and no fallback renderer, so with
        scripting off there is nothing here to read.
      </p>
      <p>
        The server-rendered pages need no scripting at all and show the same data:
        <a href="/">open the status page</a>.
      </p>
    </div>
  </noscript>

  <!--
    THE ONE LIVE REGION ON THE PAGE, and the restraint is the point.

    `role="status"` (an implicit `aria-live="polite"`, spelled out anyway because the implicit
    value is a thing readers have to know rather than see) with `aria-atomic="true"`, so a
    screen reader hears the whole banner as one sentence when it changes rather than the single
    word that differs.

    It is scoped to the ENGINE BANNER and not to `#content`, deliberately. This dashboard
    re-reads itself every 15 seconds; a live region around the data would re-announce every
    table on the page twice a minute, which is not an accessibility feature but a denial of
    service against anyone using a screen reader. What genuinely changes MEANING underneath a
    reader is whether keel is running and when the figures were read -- one short sentence,
    which is exactly what this element holds. The rest of the page changes bytes, and a reader
    who wants it re-read can re-read it.

    Empty in the markup: it is filled by `render.js` on the first response. An `aria-live`
    region must exist in the DOM BEFORE the content it announces is inserted, which is why it is
    here as an empty element rather than created alongside the banner.
  -->
  <div id="engine" class="engine" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="content" aria-busy="true">
    <p class="empty">Reading keel&hellip;</p>
  </div>

</main>

<footer>
  <span>keel &middot; served from this machine only</span>
  <!--
    Empty until a new build has installed and is waiting (#538). `main.js` fills it with one
    button; taking the offer sends the waiting worker `SKIP_WAITING` and reloads once it has
    taken over. It lives here, beside the build line it is about to change, rather than in the
    engine banner: that banner is the page's one `aria-live` region and it answers "is keel
    running", so an upgrade notice there would interrupt a screen reader mid-table to say
    something that can wait indefinitely.
  -->
  <span id="update"></span>
  <span id="build" class="muted"></span>
</footer>

</body>
</html>
