# SonarQube analysis configuration for keel. Read by `SonarSource/sonarqube-scan-action` in
# `.github/workflows/code-quality.yml`; the scanner picks this file up automatically from the
# project base directory, so the workflow passes no `-Dsonar.*` arguments of its own.
#
# NOTE ON THE PROJECT KEY: `sonar.projectKey` must match the key of the project as it exists on the
# SonarQube server -- the scan fails if it does not. The value below follows SonarQube Cloud's
# convention of `<org>_<repo>` for a GitHub-imported project. If the project was created by hand,
# or lives on a self-hosted SonarQube Server, change it to whatever the server shows. On SonarQube
# Cloud you must also set `sonar.organization` (left commented out below, because a wrong value is
# worse than a missing one -- it fails with a misleading "project not found" rather than a clear
# "no organization").
sonar.projectKey=CodeGateSoftware_keel
sonar.projectName=keel

# --- What gets analysed ------------------------------------------------------------------------
# Three source roots, matching how the repo is actually laid out:
#   keel/      the application and CLI
#   packages/  the five uv workspace members (keel-core, keel-broker-{api,coinbase,fake,robinhood})
#   scripts/   operator/release tooling that is real Python and can really break
sonar.sources=keel,packages,scripts
# Declared as tests, not sources, on purpose: Sonar applies a separate (lighter) rule profile to
# test code, and keeps it out of the coverage denominator. Listing `tests/` under `sonar.sources`
# instead would measure every fixture and assertion helper as if it were shipping code.
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# --- Coverage ----------------------------------------------------------------------------------
# Produced by `uv run pytest --cov --cov-report=xml` in the workflow. `[tool.coverage.run]` in
# pyproject.toml sets `relative_files = true` so the paths inside this report are repo-relative and
# resolve against the two `<sources>` roots the report declares; absolute paths would only match if
# the scanner ran from the byte-identical directory the tests ran in.
sonar.python.coverage.reportPaths=coverage.xml

# --- Exclusions --------------------------------------------------------------------------------
# `.venv` and `dist` are build output, not source: uv materialises the whole dependency tree into
# `.venv/`, and analysing third-party code would bury keel's own findings under thousands of
# other people's. `keel/_build_info.py` does not exist in a checkout at all -- release.yml
# generates it at build time -- so it is excluded to keep behaviour identical either way.
# `docs/superpowers` is vendored third-party agent tooling that keel does not maintain.
sonar.exclusions=\
  .venv/**,\
  **/.venv/**,\
  dist/**,\
  **/dist/**,\
  build/**,\
  docs/superpowers/**,\
  keel/_build_info.py,\
  **/__pycache__/**,\
  **/*.egg-info/**

# The same generated/vendored paths must be kept out of the coverage denominator too; an exclusion
# from analysis does not automatically imply one from coverage.
sonar.coverage.exclusions=\
  scripts/**,\
  keel/_build_info.py,\
  docs/superpowers/**
