# keel runtime configuration -- SUPERVISED-LIVE SANDBOX (confirm mode, tiny caps).
#
# Purpose: a small, human-approved live test of the 5-trend Turtle running IN PARALLEL with the
# paper-forward (which stays on config.paperforward.yaml + keel.db, untouched). Every order is
# PREVIEWED and requires a typed `y`. Caps are deliberately tiny so a bad fill can lose only a
# few dollars.
#
# Authored in the dev repo and TRACKED there since 183dcdb. DEPLOYED to ~/keel at arm-time
# alongside its OWN database keel-live.db. There it runs as:
#   .venv/bin/keel --config config.live-sandbox.yaml --db keel-live.db agent   (interactive)
# The repo copy is the backup of record: edit both, or they drift.

# The 5 assets this sandbox trades. Keeping SOL/LTC/LINK off this list is the RIGHT call -- but
# an earlier version of this comment gave reasons that were not true, so the reasons are restated
# here. Full working: docs/experiments/2026-08-07-unvalidated-skip-set-reassessment.md.
#
# What that comment got RIGHT: these 5 are exactly the `paper`-status rules in keel.db
# (10/11/12 BTC/ETH/PAXG + 22 XLM + 24 ADA), so "same as the paper-forward" was accurate.
#
# What it got WRONG: it also credited "the walk-forward/PBO analysis". No walk-forward or PBO run
# has ever covered ADA or XLM -- every such run in docs/experiments/ stopped at BTC/ETH/PAXG, and
# the walk-forward that exists tuned a PARAMETER (turtle_breakout.py:113, entry_lookback 20 -> 40),
# it never validated a set of assets. And these 5 did not clear the promotion gate: keel-live.db
# rules 1-5 carry promoted_at IS NULL, seeded straight to `live` through the bypass `rules seed`
# warns about. (Rule 6, the BTC dca, IS promoted -- and has a filled live order and an open
# position, so this deployment is NOT inert.)
#
# The reason that DOES hold up -- established 2026-08-07 by running the backtest nobody had run,
# so it is a post-hoc vindication of the 2026-07-24 exclusion, not the reason it was made.
# `keel rules backtest` on a COPY of keel.db, in-sample, one window (SOL/LTC/LINK candles 6 days
# stale; the allowlisted rows are current):
#   21 SOL   n=13  win 23.1%  expectancy   -12.41   pf  0.26   <- excluded
#   23 LTC   n= 5  win  0.0%  expectancy   -13.09   pf  0.00   <- excluded
#   25 LINK  n=15  win 20.0%  expectancy    -0.66   pf  0.63   <- excluded
#   22 XLM   n= 8  win 37.5%  expectancy    +0.06   pf 11.44
#   24 ADA   n= 6  win 50.0%  expectancy    +0.12   pf  5.52
#   10 BTC   n=13  win 46.2%  expectancy +1353.99   pf  1.61
#   11 ETH   n=13  win 30.8%  expectancy   +45.72   pf  1.21
#   12 PAXG  n= 4  win 50.0%  expectancy  +212.15   pf  3.25
# COMPARE ON pf, NOT expectancy: expectancy is quote-currency per trade, so it tracks the asset's
# price (BTC ~64k vs XLM ~0.30) and is meaningless across rows. On the scale-free metric the split
# is clean -- every excluded asset is pf < 1 (losing), every included one is pf > 1.
#
# That is a real adverse result for SOL/LTC/LINK, and NOT a compliance one: all three were attested
# 2026-07-23 alongside ADA/XLM under the same governing source (KB source-86; LINK's is more
# carefully qualified, as a utility token), all three ADMIT `keel assets screen`, and all three
# carry MORE daily history (1827 bars) than PAXG (456 native-USD bars, on this list only via a
# documented screen_exceptions waiver).
#
# Read the numbers with the sample sizes in view: n=4..15 against min_trades=100. NOT ONE of the
# eight rules above can clear the promotion gate on this evidence -- the live five included. The
# split is directionally supported, not validated. Do not treat a positive pf here as a licence to
# add an asset, and do not add SOL/LTC/LINK on the strength of their screen/attestation status.
allowlist:
  - BTC
  - ETH
  - PAXG
  - ADA
  - XLM
  # DOGE added 2026-08-13 by operator instruction. Attestation + instrument attestation copied
  # VERBATIM from keel.db (the operator's own 2026-08-11 records, attributed to them, not
  # re-authored) so the live screen has the same basis the paper one does.
  # ⚠️ THE EVIDENCE FOR IT IS WEAK AND THE OPERATOR WAS TOLD SO BEFORE THIS EDIT. DOGE was chosen
  # on a DAILY net profit factor of 1.175 measured on n=13. On 2026-08-13 the same rule was
  # re-measured on HOURLY bars at n=279 -- the only sample large enough to read -- and returned
  # 0.348. Across all 20 rules the daily and hourly rankings correlate at rho = -0.009, i.e. not
  # at all, so the daily figure that selected DOGE carries no information about its behaviour on
  # the measurable sample. NO configuration of this rule on this asset is net-positive at the
  # 1.2% taker rate we pay.
  # ⚠️ Its source text below-the-line in the DB still says "exactly 5,000,000,000 DOGE issued per
  # year"; run-log CORRECTION 3 (2026-08-11) established the figure is 5,256,000,000. The record
  # was copied unedited rather than silently corrected -- fix it at source if you want it right.
  - DOGE

# ---------------------------------------------------------------------------------------------
# STANDING EXCEPTION -- RETIRED 2026-09-15. The five live-seeded rules are now `paper`.
#
# HISTORY. keel-live.db rules 1-5 were seeded straight to `status=live` on 2026-07-24 with
# promoted_at NULL. `keel rules seed` printed "Do not leave live-seeded rules in place
# afterwards." They were left in place deliberately, reviewed 2026-08-08, on this reasoning:
# the promotion floor is min_trades=100 PER RULE and the strategy cannot reach it (BTC/ETH
# ~2.59 trades/yr -> ~39 years; XLM ~63; ADA ~84; PAXG ~31), so waiting for the gate was "not a
# slower path to the same place; it is no path," and the sandbox existed to accumulate the live
# evidence the gate demands and cannot itself produce. That argument was sound and is NOT
# what retired it.
#
# WHAT RETIRED IT. Two of this block's own REVISIT triggers fired at once on 2026-09-15:
#
#   1. CAPS WERE RAISED past this sandbox's scale -- 200/100 -> 400/200 (see the caps note
#      below). The trigger read "caps are raised above this sandbox's few-dollars-of-damage
#      scale," and $400 is that. The raise was needed for a different reason entirely: guard 6
#      was vetoing the weekly $50 DCA because BTC exposure ($101.81) already exceeded the old
#      $100 per-asset ceiling. DCA, not the Turtle, is what needed the headroom.
#
#   2. AN EXIT-LIFECYCLE DEFECT CAME TO LIGHT (issue #799). On 2026-08-25 rule 3's PAXG entry
#      FILLED ($61.71, order id=4) and the protective SELL preview then threw
#      `decimal.InvalidOperation`, aborting before `open_position` ran. There is no `positions`
#      row, so no channel exit and no 2xATR stop can ever fire for that holding, its computed
#      stop (4521.76) exists only in the log, and guard 6 still counts the $61.71 forever
#      because it reads `orders`, not `positions`. A trend rule whose exits cannot fire is not
#      running the experiment this block was protecting -- it is accumulating unmanaged spot.
#      The fix landed on the retired `cb_client.py` and NOT on the adapter #524 migrated to, so
#      the same failure would recur today.
#
# The evidence question is unchanged and still points the same way: on 2026-09-15
# `research significance` returned "not distinguishable from zero" for every rule tested
# (BTC n=13 -> 5.05 effective, p=0.3963; ADA p=0.3218; XLM p=0.1593), at both fee regimes.
# That was ALREADY conceded here ("not a claim these rules are validated") and is not new
# grounds for demotion -- it is the reason the cap raise must not be read as sizing them up.
#
# WHAT BOUNDS THE RISK NOW. Only rule 6 (dca, BTC) is live, and DCA is fixed-budget
# accumulation rather than an edge claim. The caps below, the 18 un-overridable guards.py
# rails, rail 1's allowlist above, and rail 14's monthly allowance all still apply.
#
# WHAT THIS IS NOT. Not a judgement that the 2026-08-08 decision was wrong -- it was right on
# its facts, and rules 3 and 5 did place live orders (2026-08-25 and 2026-08-22), so the
# experiment was functioning, not inert. Not a precedent for adding assets. Not a claim these
# rules are validated.
#
# THE PATH BACK. Re-promote to `live` when #799 is fixed AND verified on the adapter path (a
# filled entry must produce a position row or an explicitly UNBRACKETED one), AND order id=4 is
# reconciled, AND caps are either returned to the few-dollars scale or a fresh significance
# verdict justifies the size. Re-promoting on the $400 caps without that is the mistake this
# block now exists to prevent. DOGE (rule 7) is excluded from any such promotion for the reason
# in its own allowlist note: no configuration is net-positive at the 1.2% taker rate.
# Full working: docs/experiments/2026-08-07-unvalidated-skip-set-reassessment.md,
# docs/go-live-runbook.md §3, and issues #797/#798/#799.
# ---------------------------------------------------------------------------------------------

target_weights:
  BTC: 0.30
  ETH: 0.20
  PAXG: 0.20
  ADA: 0.15
  XLM: 0.15

risk_pct: 0.01   # 1% of the (proxy) equity risked per trade

caps:
  # NOTE: these are POSITION/SIZE caps, NOT a monthly spend cap. The MONTHLY spend limit you
  # asked for (start $200/mo, scale to your Coinbase Basic $500/mo) is Rail 14, stored in the DB
  # (keel-live.db) via `keel subscription set --free-volume-usd 200`, NOT here. To scale it later:
  #   keel --config config.live-sandbox.yaml --db keel-live.db subscription set --free-volume-usd 500
  #
  # max_exposure_usd = the TOTAL held-at-once ceiling AND the live sizing equity proxy, so it also
  # bounds order size: at risk_pct 0.01 and a ~2xATR stop, a proposed order lands around $60-80.
  # Think of it as "this sandbox is a $200 account." Raise it alongside the monthly cap as you scale.
  #
  # Briefly raised to 500 on 2026-08-11 and reverted the same day. Recording why, so the same
  # change is not made again for the same wrong reason: it was raised on the theory that sizing
  # was why live had not traded, on the evidence that the live loop had never DETECTED a setup --
  # every cycle logged `signals=0`. (The account that WAS deadlocked by sizing-vs-allowance is the
  # PAPER one; see config.paperforward.yaml.)
  #
  # THAT EVIDENCE EXPIRED on 2026-09-11. Cycle d4f95d6c954b4c33 at 01:20Z detected a dca setup on
  # BTC-USD (cts_score 4, confirm_3bar) and the executor vetoed the order on FOUR guards at once:
  # total_exposure_cap (163.51 + 50.00 = 213.51 > 200), per_asset_concentration_cap (BTC 151.81 >
  # the 0.50 * 200 = 100 ceiling), plus rails 17 and 22, both since attested. So this cap DOES now
  # block a real order -- but raising it is still not the fix, for the reason in the next
  # paragraph, and the per-asset ceiling binds before the total does.
  #
  # Raising it also has a cost that is easy to miss, because this value is a SIZING PROXY and not
  # only a ceiling: risk per trade is 1% of THIS number, not of real equity. Real live equity is
  # ~$478 (equity_points id 8, 2026-09-14), so at 500 each trade would risk $5 -- about 1.0% of
  # what the account actually holds. Note that raising it CANNOT fix `doctor`'s sizing.admissible
  # failure: order size scales 1:1 with this number, so the bands move with the cap and the ratio
  # max_per_order_usd/max_exposure_usd is what binds. Measured 2026-09-15 on a scratch copy:
  # at 400/200 every band still exceeded the cap (ADA $406.85-$542.47 against $200). The finest
  # configured granularity is the actual lever -- see the market_data note below.
  #
  # Raise this only when the account has actually grown into it, and raise rail 14's monthly cap
  # (stored in keel-live.db, NOT here -- still $200) in the same change:
  #   keel --config config.live-sandbox.yaml --db keel-live.db subscription set --free-volume-usd 500
  # Raised 200 -> 400 on 2026-09-15, with the arithmetic recorded. Measured BTC exposure at the
  # time was $101.81 (the two filled DCA buys at fill economics, $50.00 + $51.81) against a $100
  # ceiling -- already over before any new order, which is why guard 6 vetoed the weekly $50 DCA.
  # At 400 the BTC ceiling is $200 and the projection is $101.81 + $50 = $151.81, clearing it
  # with $48.19 of headroom.
  #
  # NOTE the figure that matters is $101.81, NOT the $151.81 in the veto message -- that one is
  # already the PROJECTION (existing + proposed). Reading $151.81 as the existing exposure gives
  # $151.81 + $50 = $201.81 and concludes, wrongly, that even a $400 cap still blocks DCA.
  #
  # The six turtle_breakout rules were demoted live -> paper in the same change: on 2026-09-15
  # `research significance` returned "not distinguishable from zero" for every one tested
  # (BTC n=13 -> 5.05 effective, p=0.3963; ADA p=0.3218; XLM p=0.1593), so this increase sizes up
  # NOTHING with a measured edge. Only rule 6 (dca) stays live, and DCA is fixed-budget
  # accumulation rather than an edge claim. Re-promoting a turtle rule onto this cap without a
  # fresh significance verdict is the mistake this comment exists to prevent.
  # Per-asset ceiling raised 0.50 -> 0.75 on 2026-09-26 ($200 -> $300). BTC stood at $151.81 at
  # cost (three $50 DCA buys), so the fourth projected to $201.81 and guard 6 vetoed it on
  # 2026-09-25. Exposure is measured at COST, so a falling price never frees room: at 0.50 the
  # weekly DCA was permanently capped at three buys. 0.75 admits three more ($301.81 is the
  # first projection over). max_exposure_usd, the sizing proxy, is deliberately unchanged.
  max_exposure_usd: 400      # total open exposure across all positions AT ONCE (NOT per day, NOT per month)
  max_per_order_usd: 200     # per-single-order ceiling
  max_per_day_usd: 200       # per-rolling-24h ceiling -- deliberately LEFT at 200, so one
                             # max-sized order consumes the whole day's budget
  max_per_asset_pct: 0.75    # no single asset may exceed 75% of the $400 exposure ($300)

market_data:
  # THE FINEST ENTRY HERE SETS POSITION SIZE, not just what the rules see. `doctor`'s
  # sizing.admissible convention is "ATR(14) on the finest configured granularity", and order
  # size is risk_pct * max_exposure_usd / stop_distance. A 2xATR stop on FIFTEEN_MINUTE bars is
  # ~0.5% of BTC's price, so a $2 risk budget asks for an ~$875 position -- which is why every
  # band fails max_per_order_usd while the caps look generous.
  #
  # Measured 2026-09-15 on a scratch copy of this profile at the CURRENT caps (200/100/0.01):
  #   finest = FIFTEEN_MINUTE  -> [FAIL] 0 of 6 products fit ($100 cap; ADA $159.89-$213.19)
  #   finest = ONE_HOUR        -> [warn] 1 of 6 fit       (ADA $96.40-$128.53 straddles)
  #   finest = ONE_DAY         -> [ok]   6 of 6 fit       ($16.07-$77.21 orders)
  #
  # The turtle_breakout rules are 40/20-lookback donchian systems -- a DAILY convention. Running
  # them on 15-minute bars is very likely not what was intended. DO NOT just delete the line:
  # dropping a granularity changes what every rule EVALUATES on, not only what ATR measures, so
  # it is a strategy change that belongs in a backtest on config.paperforward.yaml first.
  granularities:
    - ONE_DAY
    - ONE_HOUR
    - FIFTEEN_MINUTE
  history_days: 365

auto_trade:
  # ⚠️ `autonomous` IS NOT A VALID VALUE HERE, and trying it takes the whole deployment down:
  # `keel_core/config.py:346` rejects anything outside ('paper', 'confirm') with a ConfigError,
  # so every command that loads this file fails, not just trading. This was tried on 2026-08-13
  # and reverted. AUTONOMY IS A PROFILE CHOICE, NOT A MODE -- `mode: confirm` PLUS `keel autonomy
  # on`, which is stored in the profile row, not in this file.
  #
  # WHAT IS ACTUALLY IN FORCE: `agent.py::_effective_mode` returns "autonomous" only when
  # `config.auto_trade.mode == "confirm"` AND `repo.get_profile().is_autonomous(now)`. Autonomy
  # has been granted since 2026-08-05 23:10 UTC with no expiry, so the effective mode IS already
  # autonomous and orders place unattended -- verified 2026-08-13 by evaluating that expression
  # against keel-live.db. `keel autonomy show` is the authority; this line alone tells you nothing.
  #
  # ⚠️ DO NOT read `mode: confirm` as "orders need confirming", and do NOT read a stored order's
  # `confirmation` column as a config value -- it records the EXECUTOR mode `_effective_mode`
  # produced (order 1, BTC dca 2026-08-07, reads `autonomous` while this file said `confirm`).
  # The profile is read fresh each cycle, so `keel autonomy off` takes effect next cycle;
  # `keel kill` is what stops trading immediately.
  mode: confirm
  # ⚠️ `enabled` IS A DEAD FLAG -- verified 2026-08-13. It is parsed into `AutoTradeConfig.enabled`
  # at `packages/keel-core/keel_core/config.py:731` and read by NO code path anywhere in `keel/`
  # or `packages/`. It is present in the shipped templates too. Setting it false does NOT disable
  # auto-trading and never has; `mode` is the only control. Left as-is rather than silently
  # flipped, because changing it would imply it does something. Either wire it up or delete it.
  enabled: false
  interval_sec: 900

promotion:
  min_trades: 100
  min_expectancy: 0.0
  min_rr: 1.5
  min_win_rate: 0.55

money_mgmt:
  profit_trigger_pct: 0.10
  acceleration_pct: 0.05
  max_total_dd_pct: 0.20
  max_weekly_dd_pct: 0.08
  max_consecutive_losses: 0
  streak_cooloff_days: 0

dca:
  budget_usd: 50
  cadence_days: 7

# The settlement currency this deployment TRADES IN -- USD, matching the cached -USD history and
# the paper-forward. (each product spends USD, so the account needs a USD balance to fund a buy;
# rail 13 vetoes if there's no USD available -- see the note when you arm.)
quote_currency: USD

subscription:
  assumed_free_volume_usd: 500
  unsubscribed_allowance_usd: 0
  pacing: opportunistic

tiers:
  - name: Basic
    free_volume_usd: 500
    subscription_usd_month: 4.99
  - name: Preferred
    free_volume_usd: 10000
    subscription_usd_month: 29.99
  - name: Premium
    free_volume_usd: null
    subscription_usd_month: 299.99

fees:
  taker_pct: 0.012
  maker_pct: 0.006

# verbose: true since 2026-07-29, matching config.paperforward.yaml -- the detector's `signals=N`
# line says nothing about why a setup was or wasn't taken, and on the live side the rail vetoes
# are exactly what you want on record. Separate file from the paper deployment, so the two
# never interleave.
logging:
  verbose: true
  file: logs/keel-live.log
  max_file_mb: 25
  file_count: 5

research:
  pbo_max: 0.05
  slope_floor: -0.5
