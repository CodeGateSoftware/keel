# keel runtime configuration -- SUPERVISED-LIVE SANDBOX (confirm mode, tiny caps).
#
# Purpose: a small, human-approved live test of the 5-trend Turtle running IN PARALLEL with the
# paper-forward (which stays on config.paperforward.yaml + keel.db, untouched). Every order is
# PREVIEWED and requires a typed `y`. Caps are deliberately tiny so a bad fill can lose only a
# few dollars.
#
# Authored in the dev repo and TRACKED there since 183dcdb. DEPLOYED to ~/keel at arm-time
# alongside its OWN database keel-live.db. There it runs as:
#   .venv/bin/keel --config config.live-sandbox.yaml --db keel-live.db agent   (interactive)
# The repo copy is the backup of record: edit both, or they drift.

# The 5 assets this sandbox trades. Keeping SOL/LTC/LINK off this list is the RIGHT call -- but
# an earlier version of this comment gave reasons that were not true, so the reasons are restated
# here. Full working: docs/experiments/2026-08-07-unvalidated-skip-set-reassessment.md.
#
# What that comment got RIGHT: these 5 are exactly the `paper`-status rules in keel.db
# (10/11/12 BTC/ETH/PAXG + 22 XLM + 24 ADA), so "same as the paper-forward" was accurate.
#
# What it got WRONG: it also credited "the walk-forward/PBO analysis". No walk-forward or PBO run
# has ever covered ADA or XLM -- every such run in docs/experiments/ stopped at BTC/ETH/PAXG, and
# the walk-forward that exists tuned a PARAMETER (turtle_breakout.py:113, entry_lookback 20 -> 40),
# it never validated a set of assets. And these 5 did not clear the promotion gate: keel-live.db
# rules 1-5 carry promoted_at IS NULL, seeded straight to `live` through the bypass `rules seed`
# warns about. (Rule 6, the BTC dca, IS promoted -- and has a filled live order and an open
# position, so this deployment is NOT inert.)
#
# The reason that DOES hold up -- established 2026-08-07 by running the backtest nobody had run,
# so it is a post-hoc vindication of the 2026-07-24 exclusion, not the reason it was made.
# `keel rules backtest` on a COPY of keel.db, in-sample, one window (SOL/LTC/LINK candles 6 days
# stale; the allowlisted rows are current):
#   21 SOL   n=13  win 23.1%  expectancy   -12.41   pf  0.26   <- excluded
#   23 LTC   n= 5  win  0.0%  expectancy   -13.09   pf  0.00   <- excluded
#   25 LINK  n=15  win 20.0%  expectancy    -0.66   pf  0.63   <- excluded
#   22 XLM   n= 8  win 37.5%  expectancy    +0.06   pf 11.44
#   24 ADA   n= 6  win 50.0%  expectancy    +0.12   pf  5.52
#   10 BTC   n=13  win 46.2%  expectancy +1353.99   pf  1.61
#   11 ETH   n=13  win 30.8%  expectancy   +45.72   pf  1.21
#   12 PAXG  n= 4  win 50.0%  expectancy  +212.15   pf  3.25
# COMPARE ON pf, NOT expectancy: expectancy is quote-currency per trade, so it tracks the asset's
# price (BTC ~64k vs XLM ~0.30) and is meaningless across rows. On the scale-free metric the split
# is clean -- every excluded asset is pf < 1 (losing), every included one is pf > 1.
#
# That is a real adverse result for SOL/LTC/LINK, and NOT a compliance one: all three were attested
# 2026-07-23 alongside ADA/XLM under the same governing source (KB source-86; LINK's is more
# carefully qualified, as a utility token), all three ADMIT `keel assets screen`, and all three
# carry MORE daily history (1827 bars) than PAXG (456 native-USD bars, on this list only via a
# documented screen_exceptions waiver).
#
# Read the numbers with the sample sizes in view: n=4..15 against min_trades=100. NOT ONE of the
# eight rules above can clear the promotion gate on this evidence -- the live five included. The
# split is directionally supported, not validated. Do not treat a positive pf here as a licence to
# add an asset, and do not add SOL/LTC/LINK on the strength of their screen/attestation status.
allowlist:
  - BTC
  - ETH
  - PAXG
  - ADA
  - XLM

# ---------------------------------------------------------------------------------------------
# STANDING EXCEPTION: the five live rules bypassed the promotion gate, deliberately, and stay.
#
# keel-live.db rules 1-5 were seeded straight to `status=live` on 2026-07-24 with promoted_at
# NULL. `keel rules seed` printed "Do not leave live-seeded rules in place afterwards." They have
# been left in place. That is a decision, reviewed 2026-08-08 and recorded here rather than left
# silent -- the same standard docs/experiments/2026-07-20-allowlist-screen-first-run.md set for
# PAXG: "The one thing not to do is leave it silently exempt because it was already there."
#
# WHY KEEP THEM. The promotion floor is min_trades=100 PER RULE. This strategy cannot reach it.
# Measured 2026-08-08 by backtesting each rule over ~5.02 years of daily bars:
#   BTC  13 trades = 2.59/yr -> 100 trades in ~39 years
#   ETH  13 trades = 2.59/yr -> ~39 years
#   XLM   8 trades = 1.59/yr -> ~63 years
#   ADA   6 trades = 1.19/yr -> ~84 years
#   PAXG  4 trades = 3.20/yr -> ~31 years
# Waiting for the gate is not a slower path to the same place; it is no path. The sandbox exists
# to accumulate the live evidence the gate demands and cannot itself produce. Demoting these
# rules would end the experiment without substituting anything for it.
#
# WHAT BOUNDS THE RISK. Not the promotion gate -- it never ran. Instead: the caps below
# (max_exposure_usd 200 total at once, max_per_order_usd 100), the 18 un-overridable guards.py
# rails, rail 1's allowlist above, and rail 14's monthly subscription allowance. The bypass is of
# the EVIDENCE gate, not of the SAFETY rails, and those are separate mechanisms.
#
# WHAT THIS IS NOT. Not a precedent for adding assets (see the allowlist note above), not a
# reason to raise caps, and not a claim these rules are validated -- they are not, and neither
# `promoted_at` nor any backtest here says otherwise.
#
# REVISIT IF: caps are raised above this sandbox's few-dollars-of-damage scale; the rule set
# changes; a rule starts trading materially more often than the table above; or this sandbox is
# treated as evidence for anything beyond itself. Full working:
# docs/experiments/2026-08-07-unvalidated-skip-set-reassessment.md and docs/go-live-runbook.md §3.
# ---------------------------------------------------------------------------------------------

target_weights:
  BTC: 0.30
  ETH: 0.20
  PAXG: 0.20
  ADA: 0.15
  XLM: 0.15

risk_pct: 0.01   # 1% of the (proxy) equity risked per trade

caps:
  # NOTE: these are POSITION/SIZE caps, NOT a monthly spend cap. The MONTHLY spend limit you
  # asked for (start $200/mo, scale to your Coinbase Basic $500/mo) is Rail 14, stored in the DB
  # (keel-live.db) via `keel subscription set --free-volume-usd 200`, NOT here. To scale it later:
  #   keel --config config.live-sandbox.yaml --db keel-live.db subscription set --free-volume-usd 500
  #
  # max_exposure_usd = the TOTAL held-at-once ceiling AND the live sizing equity proxy, so it also
  # bounds order size: at risk_pct 0.01 and a ~2xATR stop, a proposed order lands around $60-80.
  # Think of it as "this sandbox is a $200 account." Raise it alongside the monthly cap as you scale.
  max_exposure_usd: 200      # total open exposure across all positions AT ONCE (NOT per day, NOT per month)
  max_per_order_usd: 100     # per-single-order ceiling
  max_per_day_usd: 200       # per-rolling-24h ceiling
  max_per_asset_pct: 0.50    # no single asset may exceed 50% of the $200 exposure ($100)

market_data:
  granularities:
    - ONE_DAY
    - ONE_HOUR
    - FIFTEEN_MINUTE
  history_days: 365

auto_trade:
  mode: confirm   # LIVE, but every order asks for a typed `y` first (fails closed with no human)
  enabled: false
  interval_sec: 900

promotion:
  min_trades: 100
  min_expectancy: 0.0
  min_rr: 1.5
  min_win_rate: 0.55

money_mgmt:
  profit_trigger_pct: 0.10
  acceleration_pct: 0.05
  max_total_dd_pct: 0.20
  max_weekly_dd_pct: 0.08
  max_consecutive_losses: 0
  streak_cooloff_days: 0

dca:
  budget_usd: 50
  cadence_days: 7

# The settlement currency this deployment TRADES IN -- USD, matching the cached -USD history and
# the paper-forward. (each product spends USD, so the account needs a USD balance to fund a buy;
# rail 13 vetoes if there's no USD available -- see the note when you arm.)
quote_currency: USD

subscription:
  assumed_free_volume_usd: 500
  unsubscribed_allowance_usd: 0
  pacing: opportunistic

tiers:
  - name: Basic
    free_volume_usd: 500
    subscription_usd_month: 4.99
  - name: Preferred
    free_volume_usd: 10000
    subscription_usd_month: 29.99
  - name: Premium
    free_volume_usd: null
    subscription_usd_month: 299.99

fees:
  taker_pct: 0.012
  maker_pct: 0.006

# verbose: true since 2026-07-29, matching config.paperforward.yaml -- the detector's `signals=N`
# line says nothing about why a setup was or wasn't taken, and on the live side the rail vetoes
# are exactly what you want on record. Separate file from the paper deployment, so the two
# never interleave.
logging:
  verbose: true
  file: logs/keel-live.log
  max_file_mb: 25
  file_count: 5

research:
  pbo_max: 0.05
  slope_floor: -0.5
